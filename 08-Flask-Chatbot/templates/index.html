
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Learning Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="chat-container">

        <header class="chat-header">
            <div class="bot-avatar">🤖</div>

            <div>
                <h1>AI Learning Chatbot</h1>
                <p>Python • Flask • AI/ML</p>
            </div>

            <span class="status">Online</span>
        </header>

        <section
            id="chat-box"
            class="chat-box"
            aria-label="Chat messages"
            aria-live="polite"
        >
            <div class="message bot-message">
                Hello! 👋 I'm your AI Learning Chatbot.
                Ask me about Python, AI, ML, NLP,
                NumPy, Pandas, or Flask.
            </div>
        </section>

        <form id="chat-form" class="chat-input-area">
            <input
                type="text"
                id="user-input"
                placeholder="Type your message..."
                maxlength="2000"
                autocomplete="off"
                aria-label="Your message"
                required
            >

            <button type="submit" id="send-button">
                Send
            </button>
        </form>

        <footer>
            Built with Python, Flask, HTML, CSS & JavaScript
        </footer>

    </main>

    <script src="{{ url_for('static', filename='script.js') }}">
    </script>
</body>
</html>
